<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="{{description}}" />
		<meta name="theme-color" content="#fbfaf7" />
		<title>{{title}} · @christophervr/ole2</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" />
		<link rel="stylesheet" href="{{base}}site.css" />
		<script defer src="{{base}}theme.js"></script>
	</head>
	<body>
		<a class="skip-link" href="#main">Skip to content</a>
		<header class="site-header" id="top">
			<div class="site-header__inner">
				<a class="brand" href="{{home}}"><span class="brand-mark" aria-hidden="true">O</span><span>@christophervr/<strong>ole2</strong></span></a>
				<nav aria-label="Main navigation">
					<a href="{{home}}">Home</a>
					<details class="api-nav"><summary>API guides</summary><div class="api-nav__menu">{{api_links}}</div></details>
					{{demo_nav}}
				</nav>
				<div class="header-actions">
					<a class="github-link" href="https://github.com/ChristopherVR/ole2">GitHub <span aria-hidden="true">↗</span></a>
					<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">◐</button>
				</div>
			</div>
		</header>
		<main id="main">{{content}}</main>
		<footer><span>@christophervr/ole2 · Legacy Office binary tools</span><a href="https://github.com/ChristopherVR/ole2">Source on GitHub</a></footer>
	</body>
</html>

name: Publish npm package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:package
      - name: Verify tag and publish with provenance
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish
      - name: Create GitHub release with npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT_DIR="$RUNNER_TEMP/npm-release"
          mkdir -p "$ARTIFACT_DIR"
          npm pack "https://registry.npmjs.org/@christophervr/ole2/-/ole2-$VERSION.tgz" --ignore-scripts --pack-destination "$ARTIFACT_DIR"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            FLAGS=()
            [[ "$VERSION" != *-* ]] || FLAGS+=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --title "@christophervr/ole2 $VERSION" --generate-notes "${FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" "$ARTIFACT_DIR"/*.tgz --clobber
